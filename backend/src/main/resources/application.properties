spring.application.name=skillbridge-lms-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (configured via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Authentication Configuration (Must be set via JWT_SECRET env var in production)
skillbridge.jwt.secret=${JWT_SECRET:U2tpbGxCcmlkZ2VMbXNEZXZPbmx5RmFsbGJhY2tKeyMustBeReplacedInProd2026!}
skillbridge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
skillbridge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Sample Catalog Data & Bootstrap Admin (separate from student activity)
skillbridge.seed.sample-courses=${SEED_SAMPLE_COURSES:true}
skillbridge.admin.email=${ADMIN_EMAIL:admin@skillbridge.edu}
skillbridge.admin.password=${ADMIN_PASSWORD:}
skillbridge.admin.name=${ADMIN_NAME:SkillBridge Administrator}

# External LLM API Configuration for Chatbot (Never hardcode real API keys)
skillbridge.llm.api-key=${LLM_API_KEY:${GEMINI_API_KEY:}}
skillbridge.llm.provider=${LLM_PROVIDER:gemini}
skillbridge.llm.model=${LLM_MODEL:gemini-2.5-flash}
skillbridge.llm.api-url=${LLM_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot Actuator & Structured Logging
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when_authorized
logging.level.root=INFO
logging.level.com.skillbridge.lms=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
